# SWAG proxy conf for the RustDesk web client.
# Copy to /config/nginx/proxy-confs/rustdesk-web.subdomain.conf and set
# server_name to the subdomain you use (matches RD_WEB_HOST in compose).
#
# Everything the browser needs lives on this one origin:
#   /            -> the static web client container
#   /api/        -> hbbs HTTP API        (Pro: port 21114)
#   /ws/id       -> hbbs WebSocket       (port 21118)
#   /ws/relay    -> hbbr WebSocket       (port 21119)
#
# hbbs/hbbr trust X-Forwarded-For without validation: keep 21118/21119
# reachable from SWAG only.
#
# If hbbs/hbbr run with network_mode: host, replace the container names with
# the Docker host address (e.g. 172.17.0.1).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name rdweb.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app rustdesk-web;
        set $upstream_port 80;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location /api/ {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app hbbs;
        set $upstream_port 21114;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location /ws/id {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app hbbs;
        set $upstream_port 21118;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /ws/relay {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app hbbr;
        set $upstream_port 21119;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
