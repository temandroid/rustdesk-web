server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    types {
        application/wasm wasm;
    }

    # Entry points and the generated config must never be served stale.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /rd-config.js { add_header Cache-Control "no-store"; }
    location = /flutter_bootstrap.js { add_header Cache-Control "no-store"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store"; }
    location = /version.json { add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Nothing here is dynamic; the RustDesk API and WebSocket endpoints are
    # routed by the reverse proxy in front of this container (see deploy/).
}
